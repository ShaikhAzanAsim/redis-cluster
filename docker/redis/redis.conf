# Shared base config for every node in the cluster.
# Per-node differences (announce-ip, requirepass/masterauth) are passed as
# command-line overrides in docker-compose.yml so this file stays identical
# for all 9 nodes.

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage yes

appendonly yes
appendfsync everysec

# Belt-and-suspenders default: a replica never accepts writes. In cluster
# mode the client actually sees a MOVED redirect to the owning master before
# this check is even reached (a replica owns no hash slots itself), but this
# still matters if cluster mode is ever disabled for local/debug use.
replica-read-only yes

protected-mode no
dir /data
